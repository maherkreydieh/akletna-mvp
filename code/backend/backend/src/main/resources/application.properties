spring.application.name=backend
spring.config.import=optional:file:./config/application-local.properties,optional:file:./backend/config/application-local.properties
spring.datasource.url=${AKLETNA_DB_URL}
server.port=${AKLETNA_SERVER_PORT:18091}
spring.datasource.username=${AKLETNA_DB_USERNAME}
spring.datasource.password=${AKLETNA_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${AKLETNA_DDL_AUTO:validate}
spring.jpa.show-sql=false
akletna.discovery.high-protein-min-grams-per-serving=${AKLETNA_HIGH_PROTEIN_MIN_GRAMS_PER_SERVING:20}
spring.sql.init.mode=never
akletna.jwt.secret=${AKLETNA_JWT_SECRET}
akletna.jwt.expiration=${AKLETNA_JWT_EXPIRATION:86400000}
akletna.cors.allowed-origins=${AKLETNA_CORS_ALLOWED_ORIGINS:}

akletna.nutrition.usda.api-key=${AKLETNA_USDA_API_KEY:}
akletna.nutrition.curator-token=${AKLETNA_NUTRITION_CURATOR_TOKEN:}
